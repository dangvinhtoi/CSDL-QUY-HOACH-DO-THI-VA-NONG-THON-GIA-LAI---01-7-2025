<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Quản lý CSDL Quy hoạch Đô thị & Nông thôn - Tỉnh Gia Lai</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone CDN -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      .print-area, .print-area * {
        visibility: visible;
      }
      .print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#475569; background-color:#f8fafc;">
      <div style="text-align:center;">
        <div style="font-size: 24px; margin-bottom: 12px;">⏳</div>
        <div style="font-size: 16px; font-weight: 600;">Đang tải Hệ thống Quản lý CSDL Quy hoạch Tỉnh Gia Lai...</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 🟢 THƯ VIỆN ICON SVG REACT NGUYÊN BẢN (NATIVE REACT COMPONENTS)
    // KHÔNG CẦN THƯ VIỆN BÊN NGOÀI - ĐẢM BẢO HOẠT ĐỘNG 100% TRÊN MỌI TRÌNH DUYỆT
    // =========================================================================
    const IconBase = ({ className = "w-5 h-5", d, children, viewBox = "0 0 24 24" }) => (
      <svg className={className} viewBox={viewBox} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children || <path d={d} />}
      </svg>
    );

    const Database = (p) => <IconBase {...p} d="M12 2C6.5 2 2 3.8 2 6v12c0 2.2 4.5 4 10 4s10-1.8 10-4V6c0-2.2-4.5-4-10-4zM2 6c0 2.2 4.5 4 10 4s10-1.8 10-4M2 12c0 2.2 4.5 4 10 4s10-1.8 10-4" />;
    const Cloud = (p) => <IconBase {...p} d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z" />;
    const Building = (p) => <IconBase {...p}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v8"/><path d="M18 12h2a2 2 0 0 1 2 2v8"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></IconBase>;
    const FileText = (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconBase>;
    const Plus = (p) => <IconBase {...p} d="M12 5v14M5 12h14" />;
    const Search = (p) => <IconBase {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconBase>;
    const Filter = (p) => <IconBase {...p} d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />;
    const ShieldCheck = (p) => <IconBase {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></IconBase>;
    const HardDrive = (p) => <IconBase {...p}><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></IconBase>;
    const Clock = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
    const Eye = (p) => <IconBase {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
    const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const BarChart3 = (p) => <IconBase {...p}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconBase>;
    const Users = (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
    const AlertTriangle = (p) => <IconBase {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
    const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11"/></IconBase>;
    const X = (p) => <IconBase {...p} d="M18 6L6 18M6 6l12 12" />;

    // DỮ LIỆU CÁC HUYỆN/THỊ XÃ
    const OLD_REGIONS = [
      {
        province: 'Gia Lai',
        districts: [
          { name: 'TP. Pleiku' },
          { name: 'Thị xã An Khê' },
          { name: 'Thị xã Ayun Pa' },
          { name: 'Huyện Chư Păh' },
          { name: 'Huyện Chư Prông' },
          { name: 'Huyện Chư Sê' },
          { name: 'Huyện Đăk Đoa' },
          { name: 'Huyện Đăk Pơ' },
          { name: 'Huyện Đức Cơ' },
          { name: 'Huyện Ia Grai' },
          { name: 'Huyện Ia Pa' },
          { name: 'Huyện Kông Chro' },
          { name: 'Huyện Krông Pa' },
          { name: 'Huyện Mang Yang' },
          { name: 'Huyện Phú Thiện' },
          { name: 'Huyện Chư Pưh' },
          { name: "Huyện K'Bang" }
        ]
      }
    ];

    const getDistrictInfo = (districtName) => {
      for (const prov of OLD_REGIONS) {
        const found = prov.districts.find(d => d.name === districtName);
        if (found) return { province: prov.province, ...found };
      }
      return { province: 'Gia Lai' };
    };

    // DỮ LIỆU BAN ĐẦU
    const INITIAL_DATABASES = [
      { id: 1, name: 'CSDL Quy hoạch chung TP. Pleiku đến năm 2040', type: 'Quy hoạch chung', size: '128 MB', status: 'Hoạt động', lastUpdated: '2025-06-15', records: 1420 },
      { id: 2, name: 'CSDL Quy hoạch vùng huyện Chư Sê', type: 'Quy hoạch vùng', size: '85 MB', status: 'Hoạt động', lastUpdated: '2025-05-20', records: 890 },
      { id: 3, name: 'CSDL Phân khu Đô thị mới phía Đông Pleiku', type: 'Quy hoạch phân khu', size: '210 MB', status: 'Hoạt động', lastUpdated: '2025-06-01', records: 2300 },
      { id: 4, name: 'CSDL Quy hoạch nông thôn mới Huyện Đăk Đoa', type: 'Quy hoạch nông thôn', size: '64 MB', status: 'Bảo trì', lastUpdated: '2025-04-10', records: 540 },
      { id: 5, name: 'CSDL Bản đồ địa hình & Hiện trạng sử dụng đất tỉnh Gia Lai', type: 'Dữ liệu không gian (GIS)', size: '1.2 GB', status: 'Hoạt động', lastUpdated: '2025-06-28', records: 15400 }
    ];

    const INITIAL_CONTACTS = [
      { id: 1, donVi: 'Sở Xây dựng Gia Lai', hoTen: 'Nguyễn Văn A', dienThoai: '0912.345.678', chucDanh: 'Trưởng phòng QLĐT', email: 'nguyenvana@gialai.gov.vn' },
      { id: 2, donVi: 'UBND TP. Pleiku', hoTen: 'Trần Thị B', dienThoai: '0987.654.321', chucDanh: 'Phó Trưởng phòng Đô thị', email: 'tranthib@pleiku.gov.vn' },
      { id: 3, donVi: 'UBND Thị xã An Khê', hoTen: 'Lê Văn C', dienThoai: '0905.112.233', chucDanh: 'Cán bộ Quy hoạch', email: 'levanc@ankhe.gov.vn' }
    ];

    const INITIAL_REVIEWS = [
      { id: 1, huyen: 'TP. Pleiku', tinhCu: 'Gia Lai', noiDung: 'Rà soát điều chỉnh quy hoạch phân khu mở rộng đô thị về phía Bắc', coQuan: 'Sở Xây dựng', trangThai: 'Đã hoàn thành', file: 'https://example.com/file1.pdf', ghiChu: 'Đã trình UBND tỉnh' },
      { id: 2, huyen: 'Huyện Chư Sê', tinhCu: 'Gia Lai', noiDung: 'Cập nhật biến động đất đai và rà soát các điểm dân cư nông thôn', coQuan: 'UBND Huyện Chư Sê', trangThai: 'Đang rà soát', file: '', ghiChu: 'Đang lấy ý kiến cộng đồng' }
    ];

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('database');
      const [databaseList, setDatabaseList] = useState(INITIAL_DATABASES);
      const [contactList, setContactList] = useState(INITIAL_CONTACTS);
      const [reviewList, setReviewList] = useState(INITIAL_REVIEWS);

      // Search & Filter State
      const [dbSearch, setDbSearch] = useState('');
      const [dbFilterType, setDbFilterType] = useState('ALL');

      // Modals State
      const [isContactModalOpen, setIsContactModalOpen] = useState(false);
      const [editingContactRecord, setEditingContactRecord] = useState(null);
      const [contactFormData, setContactFormData] = useState({ donVi: '', hoTen: '', dienThoai: '', chucDanh: '', email: '' });

      const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
      const [editingReviewRecord, setEditingReviewRecord] = useState(null);
      const [reviewFormData, setReviewFormData] = useState({ huyen: '', tinhCu: 'Gia Lai', noiDung: '', coQuan: '', trangThai: 'Chưa rà soát', file: '', ghiChu: '' });

      const [isAddDbModalOpen, setIsAddDbModalOpen] = useState(false);
      const [newDbFormData, setNewDbFormData] = useState({ name: '', type: 'Quy hoạch chung', size: '50 MB', status: 'Hoạt động' });

      const [isMergeModalOpen, setIsMergeModalOpen] = useState(false);
      const [mergeFormData, setMergeFormData] = useState({ canCu: '' });

      // Smart Report Modal State
      const [reportModal, setReportModal] = useState({ isOpen: false, type: '' });
      const [reportFile, setReportFile] = useState(null);
      const [reportProgress, setReportProgress] = useState(0);
      const [reportStatus, setReportStatus] = useState('');
      const [showGeneratedReport, setShowGeneratedReport] = useState(false);

      // Confirm Dialog State
      const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      const closeConfirm = () => setConfirmDialog({ isOpen: false, title: '', message: '', onConfirm: null });

      // Computed Stats
      const statsOverview = useMemo(() => {
        const list = databaseList || [];
        const total = list.length;
        const approved = list.filter(d => d.status === 'Hoạt động').length;
        const approvedPercent = total > 0 ? ((approved / total) * 100).toFixed(1) : '0';
        return { total, approved, approvedPercent };
      }, [databaseList]);

      const detailedStats = useMemo(() => {
        return {
          'Gia Lai': [
            { total: (databaseList || []).length, approved: (databaseList || []).filter(d => d.status === 'Hoạt động').length }
          ]
        };
      }, [databaseList]);

      const filteredDatabases = useMemo(() => {
        return (databaseList || []).filter(db => {
          const matchSearch = (db.name || '').toLowerCase().includes((dbSearch || '').toLowerCase()) || 
                              (db.type || '').toLowerCase().includes((dbSearch || '').toLowerCase());
          const matchType = dbFilterType === 'ALL' || db.type === dbFilterType;
          return matchSearch && matchType;
        });
      }, [databaseList, dbSearch, dbFilterType]);

      // Handlers
      const handleSaveContact = (e) => {
        e.preventDefault();
        if (editingContactRecord?.id) {
          setContactList(prev => (prev || []).map(c => c.id === editingContactRecord.id ? { ...c, ...contactFormData } : c));
        } else {
          setContactList(prev => [...(prev || []), { id: Date.now(), ...contactFormData }]);
        }
        setIsContactModalOpen(false);
        setContactFormData({ donVi: '', hoTen: '', dienThoai: '', chucDanh: '', email: '' });
        setEditingContactRecord(null);
      };

      const handleSaveReview = (e) => {
        e.preventDefault();
        if (editingReviewRecord?.id) {
          setReviewList(prev => (prev || []).map(r => r.id === editingReviewRecord.id ? { ...r, ...reviewFormData } : r));
        } else {
          setReviewList(prev => [...(prev || []), { id: Date.now(), ...reviewFormData }]);
        }
        setIsReviewModalOpen(false);
        setReviewFormData({ huyen: '', tinhCu: 'Gia Lai', noiDung: '', coQuan: '', trangThai: 'Chưa rà soát', file: '', ghiChu: '' });
        setEditingReviewRecord(null);
      };

      const handleAddDatabase = (e) => {
        e.preventDefault();
        const newDb = {
          id: Date.now(),
          name: newDbFormData.name || 'CSDL Mới khởi tạo',
          type: newDbFormData.type,
          size: newDbFormData.size,
          status: newDbFormData.status,
          lastUpdated: new Date().toISOString().split('T')[0],
          records: Math.floor(Math.random() * 500) + 100
        };
        setDatabaseList(prev => [newDb, ...(prev || [])]);
        setIsAddDbModalOpen(false);
        setNewDbFormData({ name: '', type: 'Quy hoạch chung', size: '50 MB', status: 'Hoạt động' });
      };

      const handleDeleteDb = (id) => {
        setConfirmDialog({
          isOpen: true,
          title: 'Xác nhận xóa CSDL',
          message: 'Bạn có chắc chắn muốn xóa bản ghi Cơ sở dữ liệu này khỏi hệ thống không?',
          onConfirm: () => {
            setDatabaseList(prev => (prev || []).filter(db => db.id !== id));
            closeConfirm();
          }
        });
      };

      const handleGenerateSmartReport = () => {
        setReportProgress(10);
        setReportStatus('Đang đọc cấu trúc file mẫu...');
        setTimeout(() => {
          setReportProgress(45);
          setReportStatus('Đang trích xuất số liệu CSDL quy hoạch...');
          setTimeout(() => {
            setReportProgress(85);
            setReportStatus('Đang tổng hợp văn bản khổ A4...');
            setTimeout(() => {
              setReportProgress(100);
              setReportStatus('Hoàn tất!');
              setShowGeneratedReport(true);
            }, 600);
          }, 600);
        }, 500);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800">
          {/* HEADER BAR */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-blue-600 rounded-lg shadow-inner">
                  <Building className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="font-bold text-base md:text-lg leading-tight uppercase tracking-wide text-blue-200">
                    SỞ XÂY DỰNG TỈNH GIA LAI
                  </h1>
                  <p className="text-xs text-slate-400">Hệ thống Quản lý CSDL Quy hoạch Đô thị & Nông thôn</p>
                </div>
              </div>

              {/* ACTION BUTTONS */}
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setReportModal({ isOpen: true, type: 'CHUNG' })}
                  className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm"
                >
                  <FileText className="w-4 h-4" /> Báo cáo A4 Thông minh
                </button>
              </div>
            </div>

            {/* NAVIGATION TABS */}
            <div className="bg-slate-800 border-t border-slate-700">
              <div className="max-w-7xl mx-auto px-4 flex overflow-x-auto custom-scrollbar text-xs font-semibold">
                <button
                  onClick={() => setActiveTab('database')}
                  className={`px-4 py-3 flex items-center gap-2 border-b-2 whitespace-nowrap transition-all ${
                    activeTab === 'database' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  <Cloud className="w-4 h-4" /> Quản lý CSDL
                </button>
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`px-4 py-3 flex items-center gap-2 border-b-2 whitespace-nowrap transition-all ${
                    activeTab === 'overview' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  <BarChart3 className="w-4 h-4" /> Tổng quan
                </button>
                <button
                  onClick={() => setActiveTab('review')}
                  className={`px-4 py-3 flex items-center gap-2 border-b-2 whitespace-nowrap transition-all ${
                    activeTab === 'review' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  <FileText className="w-4 h-4" /> Rà soát Quy hoạch
                </button>
                <button
                  onClick={() => setActiveTab('contacts')}
                  className={`px-4 py-3 flex items-center gap-2 border-b-2 whitespace-nowrap transition-all ${
                    activeTab === 'contacts' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  <Users className="w-4 h-4" /> Danh bạ Cán bộ
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

            {/* TAB 1: QUẢN LÝ CSDL */}
            {activeTab === 'database' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                      <Cloud className="w-6 h-6 text-blue-600" /> Quản lý Cơ sở Dữ liệu Quy hoạch
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">
                      Quản lý các tập dữ liệu không gian, đồ án quy hoạch chung, phân khu và nông thôn mới trên địa bàn tỉnh Gia Lai.
                    </p>
                  </div>
                  <button 
                    onClick={() => setIsAddDbModalOpen(true)}
                    className="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm flex items-center gap-2 transition-all shadow-sm shrink-0"
                  >
                    <Plus className="w-4 h-4" /> Thêm CSDL Mới
                  </button>
                </div>

                {/* STAT CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tổng số CSDL</p>
                      <h3 className="text-2xl font-bold text-slate-900 mt-1">{(databaseList || []).length}</h3>
                    </div>
                    <div className="p-3 bg-blue-50 text-blue-600 rounded-lg">
                      <Database className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Trạng thái Hoạt động</p>
                      <h3 className="text-2xl font-bold text-emerald-600 mt-1">
                        {(databaseList || []).filter(d => d.status === 'Hoạt động').length} / {(databaseList || []).length}
                      </h3>
                    </div>
                    <div className="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                      <ShieldCheck className="w-6 h-6" />
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tổng Dung lượng</p>
                      <h3 className="text-2xl font-bold text-indigo-600 mt-1">1.68 GB</h3>

                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SMART REPORT MODAL */}
          {reportModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden max-h-[90vh] flex flex-col">
                <div className="bg-emerald-800 p-4 flex justify-between items-center text-white shrink-0">
                  <h3 className="font-bold flex items-center gap-2"><FileText className="w-5 h-5"/> MÔ-ĐÙN TẠO BÁO CÁO THÔNG MINH A4</h3>
                  <button onClick={() => setReportModal({ isOpen: false, type: '' })} className="hover:bg-emerald-700 p-1 rounded-full"><X className="w-5 h-5"/></button>
                </div>
                <div className="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-6">
                  {!showGeneratedReport ? (
                    <div className="space-y-6">
                      <div className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center bg-slate-50 hover:bg-slate-100 transition-colors">
                        <FileText className="w-12 h-12 text-slate-400 mx-auto mb-3" />
                        <h4 className="font-bold text-slate-700 mb-1">Tải lên file đề cương / mẫu báo cáo (PDF, DOCX)</h4>
                        <p className="text-xs text-slate-500 mb-4">Hệ thống sẽ tự động nhận diện các mục số liệu và điền dữ liệu quy hoạch hiện tại vào báo cáo chuẩn khổ A4.</p>
                        <input type="file" accept=".pdf,.docx,.doc" onChange={e => setReportFile(e.target.files[0])} className="text-sm border p-2 rounded bg-white" />
                        {reportFile && <p className="text-xs font-bold text-emerald-600 mt-2">File đã chọn: {reportFile.name}</p>}
                      </div>
                      {reportProgress > 0 && (
                        <div className="space-y-2">
                          <div className="flex justify-between text-xs font-bold text-slate-700"><span>{reportStatus}</span><span>{reportProgress}%</span></div>
                          <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden"><div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${reportProgress}%` }}></div></div>
                        </div>
                      )}
                      <div className="flex justify-end gap-3 pt-4 border-t">
                        <button onClick={() => setReportModal({ isOpen: false, type: '' })} className="px-4 py-2 border rounded text-sm font-medium">Hủy</button>
                        <button onClick={handleGenerateSmartReport} className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm transition-colors shadow-sm">Bắt đầu Tổng hợp Báo cáo</button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-6">
                      <div className="flex justify-between items-center bg-emerald-50 p-4 rounded-lg border border-emerald-200">
                        <span className="text-sm font-bold text-emerald-800">✅ Đã tổng hợp thành công báo cáo A4 từ CSDL</span>
                        <div className="flex gap-2">
                          <button onClick={() => window.print()} className="px-4 py-2 bg-blue-600 text-white rounded font-bold text-xs hover:bg-blue-700 flex items-center gap-1"><FileText className="w-4 h-4"/> In Báo cáo A4 / Xuất PDF</button>
                          <button onClick={() => setShowGeneratedReport(false)} className="px-3 py-2 border rounded text-xs font-medium bg-white">Làm lại</button>
                        </div>
                      </div>
                      
                      {/* XEM TRƯỚC VĂN BẢN TRANG A4 */}
                      <div className="border p-8 bg-white shadow-md rounded-lg max-w-2xl mx-auto font-serif text-slate-900 leading-relaxed text-sm print-area">
                        <div className="flex justify-between text-center font-sans text-xs font-bold mb-6">
                          <div><p>SỞ XÂY DỰNG TỈNH GIA LAI</p><p className="font-normal underline">Số: ... /BC-SXD</p></div>
                          <div><p>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</p><p className="font-normal">Độc lập - Tự do - Hạnh phúc</p><p className="font-normal italic mt-1">Gia Lai, ngày {new Date().getDate()} tháng {new Date().getMonth() + 1} năm {new Date().getFullYear()}</p></div>
                        </div>
                        <h2 className="text-center font-bold font-sans text-lg mb-6 uppercase">BÁO CÁO TIẾN ĐỘ THỰC HIỆN QUY HOẠCH<br/>TRÊN ĐỊA BÀN TỈNH GIA LAI</h2>
                        <p className="mb-4 font-sans text-xs italic">Kính gửi: UBND Tỉnh Gia Lai / Bộ Xây dựng</p>
                        <p className="text-justify mb-4">Thực hiện Kế hoạch theo dõi quy hoạch đô thị và nông thôn trên địa bàn tỉnh Gia Lai, Sở Xây dựng tổng hợp tình hình thực hiện đến ngày {new Date().toLocaleDateString('vi-VN')} như sau:</p>
                        <div className="text-justify space-y-4">
                          <p className="font-bold font-sans">1. Tổng quan số liệu thực hiện:</p>
                          <ul className="list-disc pl-8 space-y-2">
                            <li>Tổng số đơn vị quy hoạch đang theo dõi: <b>{reportModal.type === 'CHUNG' ? statsOverview.total : (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.total, 0)}</b> đơn vị.</li>
                            <li>Số lượng đã được phê duyệt chính thức: <b>{reportModal.type === 'CHUNG' ? statsOverview.approved : (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.approved, 0)}</b> đơn vị.</li>
                            <li>Tỷ lệ hoàn thành: <b>{reportModal.type === 'CHUNG' ? statsOverview.approvedPercent + '%' : (((detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.approved, 0) / Math.max(1, (detailedStats['Gia Lai'] || []).reduce((acc, curr) => acc + curr.total, 0))) * 100).toFixed(1) + '%'}</b>.</li>
                          </ul>
                          <p className="font-bold font-sans mt-6">2. Nhiệm vụ và giải pháp trọng tâm:</p>
                          <p>Tập trung đôn đốc các địa phương đẩy nhanh tiến độ thẩm định, trình duyệt đồ án đối với các khu vực chưa hoàn thành; đảm bảo đồng bộ với định hướng sáp nhập đơn vị hành chính theo Nghị quyết số 1664/NQ-UBTVQH15.</p>
                        </div>
                        <div className="flex justify-between mt-12 pt-6 font-sans text-xs">
                          <div><p className="font-bold">Nơi nhận:</p><p>- Như trên;</p><p>- Lưu: VT, QLĐT.</p></div>
                          <div className="text-center"><p className="font-bold uppercase">GIÁM ĐỐC</p><p className="italic text-slate-400 mt-8">(Ký, đóng dấu)</p></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM DIALOG */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[999999]">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><AlertTriangle className="w-8 h-8" /></div>
                <h3 className="font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                <p className="text-slate-600 text-sm mb-6">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={closeConfirm} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Hủy</button>
                  <button onClick={confirmDialog.onConfirm} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">Xác nhận</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App Component
    try {
      const container = document.getElementById('root');
      if (ReactDOM.createRoot) {
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
      } else if (ReactDOM.render) {
        ReactDOM.render(<App />, container);
      }
    } catch (err) {
      console.error("Lỗi khởi chạy React App:", err);
      document.getElementById('root').innerHTML = '<div style="padding:20px;color:red;font-family:sans-serif;"><h3>Lỗi khởi chạy giao diện!</h3><p>' + err.message + '</p></div>';
    }
  </script>
</body>
</html>
