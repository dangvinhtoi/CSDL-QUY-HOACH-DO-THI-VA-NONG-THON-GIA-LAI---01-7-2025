<body>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // =========================================================================
    // 🟢 BỘ TẠO ICON REACT TỰ ĐỘNG TỪ THƯ VIỆN LUCIDE (KHẮC PHỤC TRIỆT ĐỂ LỖI #130)
    // =========================================================================
    function createLucideIconComponent(iconName) {
      return function LucideIcon({ className = "w-5 h-5", size = 24, color = "currentColor", strokeWidth = 2, ...props }) {
        const iconRef = useRef(null);

        useEffect(() => {
          if (iconRef.current && window.lucide) {
            iconRef.current.innerHTML = '';
            
            // Tìm định nghĩa icon trong window.lucide.icons (hỗ trợ cả PascalCase, camelCase, lowercase)
            const icons = window.lucide.icons || {};
            const key = Object.keys(icons).find(k => k.toLowerCase() === iconName.toLowerCase());
            const iconDef = key ? icons[key] : null;

            if (iconDef && window.lucide.createElement) {
              try {
                const svgElem = window.lucide.createElement(iconDef);
                if (className) svgElem.setAttribute('class', className);
                if (size) {
                  svgElem.setAttribute('width', size);
                  svgElem.setAttribute('height', size);
                }
                if (color) svgElem.setAttribute('stroke', color);
                if (strokeWidth) svgElem.setAttribute('stroke-width', strokeWidth);
                iconRef.current.appendChild(svgElem);
              } catch (e) {
                console.warn('Lỗi vẽ icon lucide:', iconName, e);
              }
            } else {
              // Icon dự phòng nhẹ nếu Lucide chưa tải xong
              iconRef.current.innerHTML = `<svg class="${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${strokeWidth}"><circle cx="12" cy="12" r="8"/></svg>`;
            }
          }
        }, [className, size, color, strokeWidth]);

        return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0 align-middle" {...props} />;
      };
    }

    // Proxy tự động trả về 1 React Component hợp lệ cho BẤT KỲ icon name nào
    const LucideIcons = new Proxy({}, {
      get: (target, prop) => {
        if (prop === 'then' || typeof prop === 'symbol') return undefined;
        if (!target[prop]) {
          target[prop] = createLucideIconComponent(prop);
        }
        return target[prop];
      }
    });

    // Giải nén các Icon cần dùng (tất cả đều là React Component chuẩn)

      Server, 
      FileText, 
      X, 
      AlertTriangle, 
      Cloud, 
      CloudUpload, 
      HardDrive, 
      RefreshCw,

      CheckCircle, 
      Clock,

      Trash2,

      Upload,

      { id: 2, name: 'CSDL Quy hoạch vùng huyện Chư Sê', type: 'Quy hoạch vùng', size: '85 MB', status: 'Hoạt động', lastUpdated: '2025-05-20', records: 890 },
      { id: 3, name: 'CSDL Phân khu Đô thị mới phía Đông Pleiku', type: 'Quy hoạch phân khu', size: '210 MB', status: 'Hoạt động', lastUpdated: '2025-06-01', records: 2300 },
      { id: 4, name: 'CSDL Quy hoạch nông thôn mới Huyện Đăk Đoa', type: 'Quy hoạch nông thôn', size: '64 MB', status: 'Bảo trì', lastUpdated: '2025-04-10', records: 540 },

      { id: 2, donVi: 'UBND TP. Pleiku', hoTen: 'Trần Thị B', dienThoai: '0987.654.321', chucDanh: 'Phó Trưởng phòng Đô thị', email: 'tranthib@pleiku.gov.vn' },

      const [newDbFormData, setNewDbFormData] = useState({ name: '', type: 'Quy hoạch chung', size: '50 MB', status: 'Hoạt động' });

        const approved = list.filter(d => d.status === 'Hoạt động').length;
        const approvedPercent = total > 0 ? ((approved / total) * 100).toFixed(1) : '0';
        return { total, approved, approvedPercent };
      }, [databaseList]);

      const filteredDatabases = useMemo(() => {

        e.preventDefault();
        if (editingContactRecord?.id) {
          setContactList(prev => (prev || []).map(c => c.id === editingContactRecord.id ? { ...c, ...contactFormData } : c));
        } else {
          setContactList(prev => [...(prev || []), { id: Date.now(), ...contactFormData }]);
        }
        setIsContactModalOpen(false);
        setContactFormData({ donVi: '', hoTen: '', dienThoai: '', chucDanh: '', email: '' });
        setEditingContactRecord(null);
      };

      const handleSaveReview = (e) => {
        e.preventDefault();
        if (editingReviewRecord?.id) {
          setReviewList(prev => (prev || []).map(r => r.id === editingReviewRecord.id ? { ...r, ...reviewFormData } : r));

          setReviewList(prev => [...(prev || []), { id: Date.now(), ...reviewFormData }]);

      return (

                >

            </div>

            {/* NAVIGATION TABS */}

                <button

                    activeTab === 'overview' ? 'border-blue-500 text-blue-400 bg-slate-900/50' : 'border-transparent text-slate-300 hover:text-white hover:bg-slate-700/50'

            {/* TAB 1: QUẢN LÝ CSDL */}

                  </div>

                    onClick={() => setIsAddDbModalOpen(true)}

                          <p className="font-bold font-sans">1. Tổng quan số liệu thực hiện:</p>
                          <ul className="list-disc pl-8 space-y-2">
                            <li>Tổng số tập CSDL quy hoạch đang theo dõi: <b>{statsOverview.total}</b> tập CSDL.</li>
                            <li>Số lượng tập CSDL đang hoạt động: <b>{statsOverview.approved}</b> CSDL.</li>
                            <li>Tỷ lệ sẵn sàng: <b>{statsOverview.approvedPercent}%</b>.</li>
                          </ul>
                          <p className="font-bold font-sans mt-6">2. Nhiệm vụ và giải pháp trọng tâm:</p>
                          <p>Tập trung đôn đốc các địa phương đẩy nhanh tiến độ thẩm định, trình duyệt đồ án đối với các khu vực chưa hoàn thành; đảm bảo đồng bộ với định hướng sáp nhập đơn vị hành chính theo Nghị quyết số 1664/NQ-UBTVQH15.</p>
                        </div>
                        <div className="flex justify-between mt-12 pt-6 font-sans text-xs">
                          <div><p className="font-bold">Nơi nhận:</p><p>- Như trên;</p><p>- Lưu: VT, QLĐT.</p></div>
                          <div className="text-center"><p className="font-bold uppercase">GIÁM ĐỐC</p><p className="italic text-slate-400 mt-8">(Ký, đóng dấu)</p></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CONFIRM DIALOG */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[999999]">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4"><AlertTriangle className="w-8 h-8" /></div>
                <h3 className="font-bold text-slate-800 mb-2">{confirmDialog.title}</h3>
                <p className="text-slate-600 text-sm mb-6">{confirmDialog.message}</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={closeConfirm} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg">Hủy</button>
                  <button onClick={confirmDialog.onConfirm} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">Xác nhận</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App Component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
